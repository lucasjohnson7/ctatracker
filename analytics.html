<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f17;
      color: #e0dff5;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }

    h2 {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7b7a99;
      margin-bottom: 16px;
    }

    /* ===== TABS ===== */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      border-bottom: 1px solid #25253a;
      padding-bottom: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #7b7a99;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }

    .tab-btn:hover { color: #e0dff5; }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: #4c6ef5;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: #1a1a2e;
      border: 1px solid #25253a;
      color: #7b7a99;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn:hover { color: #e0dff5; }

    .filter-btn.active {
      background: #4c6ef5;
      border-color: #4c6ef5;
      color: #fff;
    }

    /* ===== CONTENT ===== */
    .section { margin-bottom: 40px; }

    .card {
      background: #1a1a2e;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 0;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #7b7a99;
      margin-bottom: 4px;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-sub {
      font-size: 0.8rem;
      color: #7b7a99;
      margin-top: 2px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 0;
    }

    .stats-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    @media (max-width: 640px) { .stats-split { grid-template-columns: 1fr; } }

    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stats-col-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7b7a99;
    }

    .chart-card {
      background: #1a1a2e;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .chart-card h3 {
      font-size: 0.8rem;
      font-weight: 600;
      color: #9a99cc;
      margin-bottom: 16px;
    }

    .chart-wrap {
      position: relative;
      height: 200px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

    /* ===== PATTERNS SPLIT ===== */
    .patterns-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 800px) { .patterns-split { grid-template-columns: 1fr; } }

    .patterns-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .patterns-col-header h2 { margin-bottom: 0; }

    .time-window {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .time-window input[type="time"] {
      background: #1a1a2e;
      color: #e0dff5;
      border: 1px solid #25253a;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
    }

    .time-window input[type="time"]:focus { outline: none; border-color: #4c6ef5; }

    .time-sep { font-size: 0.8rem; color: #7b7a99; }

    /* Stack the 5 day charts vertically inside each column */
    .patterns-col .weekday-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Legacy weekday-grid (not inside patterns-col) keeps 5-across */
    .weekday-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    /* ===== COMMUTE TABLE ===== */
    .commute-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .commute-table th {
      text-align: left;
      color: #7b7a99;
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid #25253a;
    }
    .commute-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #1e1e2e;
    }
    .commute-table tr:last-child td { border-bottom: none; }
    .commute-table .faster { color: #4caf50; }
    .commute-table .slower { color: #f44336; }

    a.back {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #7b7a99;
      text-decoration: none;
    }
    a.back:hover { color: #e0dff5; }
  </style>
</head>
<body>

<header>
  <h1>Analytics</h1>
  <a class="back" href="/">← Dashboard</a>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="commute">Commute</button>
  <button class="tab-btn" data-tab="fitness">Fitness</button>
</div>

<div class="filter-bar">
  <button class="filter-btn" data-period="week">1W</button>
  <button class="filter-btn" data-period="month">1M</button>
  <button class="filter-btn" data-period="year">1Y</button>
  <button class="filter-btn active" data-period="all">All</button>
</div>

<!-- ===== COMMUTE TAB ===== -->
<div class="tab-panel active" id="tab-commute">

  <!-- Row 1: Drive -->
  <div class="stats-split">
    <div class="stats-col">
      <div class="stats-col-label">Drive — Averages</div>
      <div class="stats-row" id="driveAvgStats"></div>
    </div>
    <div class="stats-col">
      <div class="stats-col-label">Drive — Best times</div>
      <div class="stats-row" id="driveBestStats"></div>
    </div>
  </div>
  <!-- Row 2: Metra -->
  <div class="stats-split">
    <div class="stats-col">
      <div class="stats-col-label">Metra — Averages</div>
      <div class="stats-row" id="metraAvgStats"></div>
    </div>
    <div class="stats-col">
      <div class="stats-col-label">Metra — Best times</div>
      <div class="stats-row" id="metraBestStats"></div>
    </div>
  </div>
  <!-- Row 3: Comparison -->
  <div class="stats-row" id="commuteCompareStats" style="margin-bottom: 28px;"></div>

  <!-- Morning | Return split -->
  <div class="patterns-split">
    <div class="patterns-col">
      <div class="patterns-col-header">
        <h2>Morning (Home → Office)</h2>
        <div class="time-window">
          <input type="time" id="morningStart" value="05:00" />
          <span class="time-sep">–</span>
          <input type="time" id="morningEnd" value="09:00" />
        </div>
      </div>
      <div class="weekday-grid" id="morningPatterns"></div>
    </div>
    <div class="patterns-col">
      <div class="patterns-col-header">
        <h2>Return (Office → Home)</h2>
        <div class="time-window">
          <input type="time" id="returnStart" value="15:00" />
          <span class="time-sep">–</span>
          <input type="time" id="returnEnd" value="18:00" />
        </div>
      </div>
      <div class="weekday-grid" id="returnPatterns"></div>
    </div>
  </div>


</div>

<!-- ===== FITNESS TAB ===== -->
<div class="tab-panel" id="tab-fitness">

  <div class="section">
    <h2>Pull-ups</h2>
    <div class="stats-row" id="pullupStats"></div>
    <div class="chart-card">
      <h3>Daily Pull-ups</h3>
      <div class="chart-wrap"><canvas id="pullupChart"></canvas></div>
    </div>
  </div>

  <div class="section">
    <h2>Push-ups</h2>
    <div class="stats-row" id="pushupStats"></div>
    <div class="chart-card">
      <h3>Daily Push-ups</h3>
      <div class="chart-wrap"><canvas id="pushupChart"></canvas></div>
    </div>
  </div>

</div>

<a class="back" href="/">← Back to dashboard</a>

<script>
const COLORS = {
  colin:  '#4c6ef5',
  lucas:  '#f5a623',
  drive:  '#f44336',
  metra:  '#4caf50',
  static: '#555577',
  grid:   '#25253a',
  text:   '#7b7a99',
};

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { labels: { color: COLORS.text, font: { size: 11 } } },
    tooltip: { mode: 'index', intersect: false },
  },
  scales: {
    x: { ticks: { color: COLORS.text, maxRotation: 45, font: { size: 10 } }, grid: { color: COLORS.grid } },
    y: { ticks: { color: COLORS.text, font: { size: 10 } }, grid: { color: COLORS.grid } },
  },
};

// ===== Globals =====
let rawData = null;
let activePeriod = 'all';
let chartInstances = [];

function mkChart(canvas, config) {
  const c = new Chart(canvas, config);
  chartInstances.push(c);
  return c;
}

function destroyCharts() {
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
}

function filterByPeriod(rows, field = 'ts') {
  if (activePeriod === 'all') return rows;
  const cutoff = new Date();
  if (activePeriod === 'week')  cutoff.setDate(cutoff.getDate() - 7);
  if (activePeriod === 'month') cutoff.setMonth(cutoff.getMonth() - 1);
  if (activePeriod === 'year')  cutoff.setFullYear(cutoff.getFullYear() - 1);
  return rows.filter(r => new Date(r[field]) >= cutoff);
}

// ===== Tabs =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ===== Filter bar =====
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePeriod = btn.dataset.period;
    render();
  });
});

// ===== Time window adjusters =====
['morningStart', 'morningEnd', 'returnStart', 'returnEnd'].forEach(id => {
  document.getElementById(id)?.addEventListener('change', render);
});

// ===== Helpers =====
function statCard(title, value, sub) {
  return `<div class="card">
    <div class="card-title">${title}</div>
    <div class="card-value">${value}</div>
    ${sub ? `<div class="card-sub">${sub}</div>` : ''}
  </div>`;
}

function avgArr(arr) {
  const vals = arr.filter(v => v != null);
  return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
}

function slotToTime(s) {
  if (s == null) return null;
  const h = Math.floor(s / 4);
  const m = (s % 4) * 15;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function timeStrToMins(str) {
  const [h, m] = (str || '00:00').split(':').map(Number);
  return h * 60 + (m || 0);
}

function bestDriveWindow(commute, commuteReturn, layout) {
  const workWindow        = layout.workWindow    ?? 9;
  const latestArrivalMins = timeStrToMins(layout.latestArrival || '09:00');
  const officeCloseMins   = timeStrToMins(layout.officeClose   || '16:00');

  const mDriveB = {}, rDriveB = {};
  for (const r of commute) {
    const d = new Date(r.ts);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const s = d.getHours() * 4 + Math.floor(d.getMinutes() / 15);
    if (r.drive_mins != null) { mDriveB[s] = mDriveB[s] || []; mDriveB[s].push(r.drive_mins); }
  }
  for (const r of commuteReturn) {
    const d = new Date(r.ts);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const s = d.getHours() * 4 + Math.floor(d.getMinutes() / 15);
    if (r.drive_mins != null) { rDriveB[s] = rDriveB[s] || []; rDriveB[s].push(r.drive_mins); }
  }

  const avg = (b, s) => { const a = b[s]; return a && a.length ? a.reduce((x,v)=>x+v,0)/a.length : null; };

  let bestMorning = null, bestReturn = null, bestTotal = Infinity;
  for (const s of Object.keys(mDriveB).map(Number)) {
    const mD = avg(mDriveB, s);
    if (mD == null) continue;
    const arrivalMins = s * 15 + mD;
    if (arrivalMins > latestArrivalMins) continue;       // arriving after latest allowed
    const rSlot = Math.round((arrivalMins + workWindow * 60) / 15);
    if (rSlot * 15 < officeCloseMins) continue;          // leaving before office closes
    const rD = avg(rDriveB, rSlot);
    if (rD == null) continue;
    if (mD + rD < bestTotal) { bestTotal = mD + rD; bestMorning = s; bestReturn = rSlot; }
  }

  const fmt = s => s != null ? `${Math.floor(s/4)}:${String((s%4)*15).padStart(2,'0')}` : null;
  return { morningTime: fmt(bestMorning), returnTime: fmt(bestReturn) };
}

function bestWindow(commute, commuteReturn, layout) {
  const bikeToMetra       = layout.bikeToMetra   ?? 15;
  const bikeFromMetra     = layout.bikeFromMetra ?? 20;
  const bikingTotal       = bikeToMetra + bikeFromMetra;
  const workWindow        = layout.workWindow    ?? 9;
  const latestArrivalMins = timeStrToMins(layout.latestArrival || '09:00');
  const officeCloseMins   = timeStrToMins(layout.officeClose   || '16:00');

  const avgBucket = buckets => s => {
    const arr = buckets[s];
    return arr && arr.length ? arr.reduce((a, v) => a + v, 0) / arr.length : null;
  };

  // Build per-slot averages for morning
  const mDriveB = {}, mMetraB = {};
  for (const r of commute) {
    const d = new Date(r.ts);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const s = d.getHours() * 4 + Math.floor(d.getMinutes() / 15);
    if (r.drive_mins != null)      { mDriveB[s] = mDriveB[s] || []; mDriveB[s].push(r.drive_mins); }
    if (r.metra_total_mins != null){ mMetraB[s] = mMetraB[s] || []; mMetraB[s].push(r.metra_total_mins + bikingTotal); }
  }

  // Build per-slot averages for return
  const rDriveB = {}, rMetraB = {};
  for (const r of commuteReturn) {
    const d = new Date(r.ts);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const s = d.getHours() * 4 + Math.floor(d.getMinutes() / 15);
    if (r.drive_mins != null)      { rDriveB[s] = rDriveB[s] || []; rDriveB[s].push(r.drive_mins); }
    if (r.metra_total_mins != null){ rMetraB[s] = rMetraB[s] || []; rMetraB[s].push(r.metra_total_mins + bikingTotal); }
  }

  const avgM = avgBucket(mDriveB), avgMM = avgBucket(mMetraB);
  const avgR = avgBucket(rDriveB), avgRM = avgBucket(rMetraB);

  let bestMorning = null, bestReturn = null, bestSavings = -Infinity, bestSavingsMins = null;

  for (const s of Object.keys(mDriveB).map(Number)) {
    const mDrive = avgM(s), mMetra = avgMM(s);
    if (mDrive == null || mMetra == null) continue;

    // Optimal return slot: depart home at s*15 min, arrive office after mMetra min, work workWindow hours, then depart
    const arrivalMins = s * 15 + mMetra;
    if (arrivalMins > latestArrivalMins) continue;
    const returnMins = arrivalMins + workWindow * 60;
    const rSlot = Math.round(returnMins / 15);
    if (rSlot * 15 < officeCloseMins) continue;

    const rDrive = avgR(rSlot), rMetra = avgRM(rSlot);
    if (rDrive == null || rMetra == null) continue;

    const savings = (mDrive - mMetra) + (rDrive - rMetra);
    if (savings > bestSavings) {
      bestSavings     = savings;
      bestSavingsMins = Math.round(savings);
      bestMorning     = s;
      bestReturn      = rSlot;
    }
  }

  return {
    morningSlot:  bestMorning,
    returnSlot:   bestReturn,
    savingsMins:  bestSavingsMins,
    morningTime:  slotToTime(bestMorning),
    returnTime:   slotToTime(bestReturn),
    workWindow,
  };
}

function rolling7(dates, byDate) {
  return dates.map((d, i) => {
    const window = dates.slice(Math.max(0, i - 6), i + 1);
    const sum = window.reduce((s, dd) => s + (byDate[dd] || 0), 0);
    return Math.round(sum / window.length);
  });
}

// ===== Top commute stats =====
function buildCommuteStats(commute, commuteReturn, layout) {
  const bikeToMetra   = layout.bikeToMetra   ?? 15;
  const bikeFromMetra = layout.bikeFromMetra ?? 20;
  const bikingTotal   = bikeToMetra + bikeFromMetra;
  const metraFullM = r => r.metra_total_mins != null ? r.metra_total_mins + bikingTotal : null;
  const metraFullR = r => r.metra_total_mins != null ? r.metra_total_mins + bikingTotal : null;

  // Morning
  const mDrive  = avgArr(commute.map(r => r.drive_mins));
  const mTraffic = avgArr(commute.filter(r => r.drive_mins && r.drive_static_mins)
                            .map(r => r.drive_mins - r.drive_static_mins));
  const mCmp    = commute.filter(r => r.drive_mins && metraFullM(r) != null);
  const mPct    = mCmp.length ? Math.round(mCmp.filter(r => metraFullM(r) < r.drive_mins).length / mCmp.length * 100) : null;

  // Return
  const rDrive  = avgArr(commuteReturn.map(r => r.drive_mins));
  const rTraffic = avgArr(commuteReturn.filter(r => r.drive_mins && r.drive_static_mins)
                            .map(r => r.drive_mins - r.drive_static_mins));
  const rCmp    = commuteReturn.filter(r => r.drive_mins && metraFullR(r) != null);
  const rPct    = rCmp.length ? Math.round(rCmp.filter(r => metraFullR(r) < r.drive_mins).length / rCmp.length * 100) : null;

  // Work-window optimized best departure
  const bw = bestWindow(commute, commuteReturn, layout);

  // Metra averages
  const mMetra = avgArr(commute.map(r => metraFullM(r)));
  const rMetra = avgArr(commuteReturn.map(r => metraFullR(r)));

  // Totals
  const driveDailyTotal = (mDrive != null && rDrive != null) ? mDrive + rDrive : null;
  const metraDailyTotal = (mMetra != null && rMetra != null) ? mMetra + rMetra : null;
  const dailySaved      = (driveDailyTotal != null && metraDailyTotal != null) ? driveDailyTotal - metraDailyTotal : null;

  const fmt = v => v != null ? `${v}` : '--';
  const fmtSaved = v => v == null ? '--' : v > 0 ? `${v} min saved` : `${-v} min slower`;

  const bdw = bestDriveWindow(commute, commuteReturn, layout);

  document.getElementById('driveAvgStats').innerHTML = [
    statCard('Avg morning drive', `${fmt(mDrive)} min`, mTraffic != null ? `+${mTraffic} min traffic` : null),
    statCard('Avg return drive',  `${fmt(rDrive)} min`, rTraffic != null ? `+${rTraffic} min traffic` : null),
    statCard('Daily total',       `${fmt(driveDailyTotal)} min`, 'round trip'),
  ].join('');

  document.getElementById('driveBestStats').innerHTML = [
    statCard('Best leave time',  bdw.morningTime ?? '--', `${bw.workWindow}h window`),
    statCard('Best return time', bdw.returnTime  ?? '--', bdw.morningTime ? `paired w/ ${bdw.morningTime}` : null),
  ].join('');

  document.getElementById('metraAvgStats').innerHTML = [
    statCard('Avg morning Metra', `${fmt(mMetra)} min`, 'door to door'),
    statCard('Avg return Metra',  `${fmt(rMetra)} min`, 'door to door'),
    statCard('Daily total',       `${fmt(metraDailyTotal)} min`, 'round trip'),
  ].join('');

  document.getElementById('metraBestStats').innerHTML = [
    statCard('Best leave time',  bw.morningTime ?? '--', `${bw.workWindow}h window`),
    statCard('Best return time', bw.returnTime  ?? '--', bw.morningTime ? `paired w/ ${bw.morningTime}` : null),
  ].join('');

  document.getElementById('commuteCompareStats').innerHTML = [
    statCard('Morning: train faster', mPct != null ? `${mPct}%` : '--', `${mCmp.length} samples`),
    statCard('Return: train faster',  rPct != null ? `${rPct}%` : '--', `${rCmp.length} samples`),
    statCard('Daily time saved',      fmtSaved(dailySaved), 'Metra vs drive'),
  ].join('');
}

// ===== Weekday drive patterns =====
const WEEKDAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
// 5-minute slots: 288 per day (slot = hour*12 + floor(minute/5))
const SLOT_COUNT  = 288;
const ALL_SLOTS   = Array.from({length: SLOT_COUNT}, (_, i) => i);
const SLOT_LABELS = ALL_SLOTS.map(s => {
  const h = Math.floor(s / 12);
  const m = (s % 12) * 5;
  return `${h}:${String(m).padStart(2,'0')}`;
});

function timeToSlot(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 12 + Math.floor((m || 0) / 5);
}

function buildWeekdayPatterns(rows, containerId, layout, xMin, xMax) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const bikeToMetra   = (layout || {}).bikeToMetra   ?? 15;
  const bikeFromMetra = (layout || {}).bikeFromMetra ?? 20;
  const bikingTotal   = bikeToMetra + bikeFromMetra;

  const driveBuckets  = Array.from({length: 5}, () => ({}));
  const staticBuckets = Array.from({length: 5}, () => ({}));
  const metraBuckets  = Array.from({length: 5}, () => ({}));

  for (const r of rows) {
    const d = new Date(r.ts);
    const dow = d.getDay();
    if (dow === 0 || dow === 6) continue;
    const dayIdx = dow - 1;
    const slot = d.getHours() * 12 + Math.floor(d.getMinutes() / 5);
    if (r.drive_mins        != null) { driveBuckets[dayIdx][slot]  = driveBuckets[dayIdx][slot]  || []; driveBuckets[dayIdx][slot].push(r.drive_mins); }
    if (r.drive_static_mins != null) { staticBuckets[dayIdx][slot] = staticBuckets[dayIdx][slot] || []; staticBuckets[dayIdx][slot].push(r.drive_static_mins); }
    if (r.metra_total_mins  != null) { metraBuckets[dayIdx][slot]  = metraBuckets[dayIdx][slot]  || []; metraBuckets[dayIdx][slot].push(r.metra_total_mins + bikingTotal); }
  }

  container.innerHTML = WEEKDAY_NAMES.map((day, i) =>
    `<div class="chart-card">
      <h3>${day}</h3>
      <div class="chart-wrap"><canvas id="${containerId}_${i}"></canvas></div>
    </div>`
  ).join('');

  const avg = (bucket, s) => {
    const arr = bucket[s];
    return arr && arr.length ? Math.round(arr.reduce((a, v) => a + v, 0) / arr.length) : null;
  };

  WEEKDAY_NAMES.forEach((day, i) => {
    const driveVals = ALL_SLOTS.map(s => avg(driveBuckets[i], s)).filter(v => v != null);
    const driveMax  = driveVals.length ? Math.max(...driveVals) : null;
    const yMax      = driveMax != null ? Math.ceil((driveMax * 1.25) / 5) * 5 : undefined;

    mkChart(document.getElementById(`${containerId}_${i}`), {
      type: 'line',
      data: {
        labels: SLOT_LABELS,
        datasets: [
          {
            label: 'Drive',
            data: ALL_SLOTS.map(s => avg(driveBuckets[i], s)),
            borderColor: COLORS.drive,
            backgroundColor: COLORS.drive + '22',
            pointRadius: 2,
            tension: 0.3,
            fill: true,
            spanGaps: true,
          },
          {
            label: 'No traffic',
            data: ALL_SLOTS.map(s => avg(staticBuckets[i], s)),
            borderColor: COLORS.static,
            borderDash: [4, 4],
            pointRadius: 0,
            tension: 0.3,
            spanGaps: true,
          },
          {
            label: 'Metra total',
            data: ALL_SLOTS.map(s => avg(metraBuckets[i], s)),
            borderColor: COLORS.metra,
            pointRadius: 2,
            tension: 0.3,
            spanGaps: true,
          },
        ],
      },
      options: {
        ...chartDefaults,
        plugins: {
          ...chartDefaults.plugins,
          legend: { ...chartDefaults.plugins.legend, display: i === 0 },
        },
        scales: {
          ...chartDefaults.scales,
          x: {
            ...chartDefaults.scales.x,
            ticks: { ...chartDefaults.scales.x.ticks, maxTicksLimit: 8 },
            ...(xMin != null ? { min: SLOT_LABELS[xMin] } : {}),
            ...(xMax != null ? { max: SLOT_LABELS[xMax] } : {}),
          },
          y: {
            ...chartDefaults.scales.y,
            title: { display: true, text: 'min', color: COLORS.text },
            ...(yMax != null ? { max: yMax } : {}),
          },
        },
      },
    });
  });
}


// ===== Fitness =====
function buildFitnessChart(canvasId, data, statsEl) {
  const people   = [...new Set(data.map(r => r.person))].sort();
  const allDates = [...new Set(data.map(r => r.date))].sort();

  const totals = {}, maxDay = {};
  people.forEach(p => { totals[p] = 0; maxDay[p] = 0; });
  data.forEach(r => {
    if (r.count > 0) {
      totals[r.person] = (totals[r.person] || 0) + r.count;
      maxDay[r.person] = Math.max(maxDay[r.person] || 0, r.count);
    }
  });

  statsEl.innerHTML = people.flatMap(p => [
    statCard(`${p} — total`, totals[p] ?? 0),
    statCard(`${p} — best day`, maxDay[p] ?? 0),
  ]).join('');

  const colorMap = { colin: COLORS.colin, lucas: COLORS.lucas };
  const datasets = people.flatMap(p => {
    const byDate = {};
    data.filter(r => r.person === p).forEach(r => byDate[r.date] = r.count);
    const counts = allDates.map(d => byDate[d] ?? null);
    const avg7   = rolling7(allDates, byDate);
    return [
      { label: p, data: counts, borderColor: colorMap[p] || '#aaa', backgroundColor: (colorMap[p] || '#aaa') + '33', pointRadius: 3, tension: 0.3, spanGaps: true },
      { label: `${p} 7-day avg`, data: avg7, borderColor: colorMap[p] || '#aaa', borderDash: [4,4], pointRadius: 0, tension: 0.4, borderWidth: 1.5 },
    ];
  });

  mkChart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: allDates.map(d => d.slice(5)), datasets },
    options: { ...chartDefaults },
  });
}

function render() {
  if (!rawData) return;
  destroyCharts();
  const layout = rawData.layout || {};
  const commute       = filterByPeriod(rawData.commute       || [], 'ts');
  const commuteReturn = filterByPeriod(rawData.commuteReturn || [], 'ts');
  const pullups       = filterByPeriod(rawData.pullups       || [], 'date');
  const pushups       = filterByPeriod(rawData.pushups       || [], 'date');

  buildCommuteStats(commute, commuteReturn, layout);
  const mStart = timeToSlot(document.getElementById('morningStart')?.value || '05:00');
  const mEnd   = timeToSlot(document.getElementById('morningEnd')?.value   || '09:00');
  const rStart = timeToSlot(document.getElementById('returnStart')?.value  || '15:00');
  const rEnd   = timeToSlot(document.getElementById('returnEnd')?.value    || '18:00');

  buildWeekdayPatterns(commute,       'morningPatterns', layout, mStart, mEnd);
  buildWeekdayPatterns(commuteReturn, 'returnPatterns',  layout, rStart, rEnd);
  buildFitnessChart('pullupChart', pullups, document.getElementById('pullupStats'));
  buildFitnessChart('pushupChart', pushups, document.getElementById('pushupStats'));
}

async function load() {
  rawData = await fetch('/api/analytics').then(r => r.json());
  render();
}

load();
</script>
